name: Deploy
# Builds the site with the PRIVATE puzzle data and uploads it to Cloudflare Pages.
# Off until Dec sets the repo variable DEPLOY_ENABLED=true and the secrets below (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: decgagan/prompt-guess-puzzles
          token: ${{ secrets.PUZZLES_REPO_TOKEN }}   # fine-grained PAT: that repo only, Contents read-only
          path: private-puzzles
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        env:
          PUZZLES_DIR: ${{ github.workspace }}/private-puzzles
          IMAGE_SALT: ${{ secrets.IMAGE_SALT }}
        run: |
          test -n "$IMAGE_SALT" || { echo "IMAGE_SALT secret is missing"; exit 1; }
          npm run build
          npm test
      - working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name prompt-guess --branch main
